name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

# Serialize deploys so two pushes in quick succession cannot race on gh-pages.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # npm-workspaces root: the lockfile lives at the repo root and installs
      # for packages/app (the web app) are hoisted there.
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build -w packages/app

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/app/site
          publish_branch: gh-pages
